name: Verificar o app
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: App, servidor e modo sem internet combinam
        run: node $( [ -f ferramentas/verificar.js ] && echo ferramentas/verificar.js || echo verificar.js )
      - name: O app abre sem erros
        run: |
          npm install --no-save playwright@1.48.2
          npx playwright install --with-deps chromium
          node $( [ -f ferramentas/abrir-app.js ] && echo ferramentas/abrir-app.js || echo abrir-app.js )
